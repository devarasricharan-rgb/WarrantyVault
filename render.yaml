services:
  - type: web
    name: warrantyvault-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false   # Set to your external MySQL JDBC connection string
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://warranty-vault-pi.vercel.app
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: warrantyvault-uploads
      mountPath: /app/uploads
      sizeGB: 1
