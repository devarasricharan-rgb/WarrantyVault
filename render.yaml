services:
  - type: web
    name: warrantyvault-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false # Set to your external MySQL JDBC connection string (e.g. Aiven, Railway, AWS RDS)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set to your deployed Vercel frontend URL (e.g. https://warrantyvault.vercel.app)
      - key: UPLOAD_DIR
        value: uploads
