# Local Development Profile (activate with --spring.profiles.active=dev)
# This profile allows running the application locally without connecting to production.

server:
  port: ${PORT:8080}

spring:
  application:
    name: warrantyvault-backend-dev

  datasource:
    url: ${DEV_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/warrantyvault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${DEV_DB_USERNAME:${DB_USERNAME:root}}
    password: ${DEV_DB_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${DEV_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
